# Production entry point for marcusthelegend.com.
#
# Traffic arrives from the cloudflared container on the compose network, so the
# only trustworthy client IP is the one Cloudflare puts in CF-Connecting-IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

log_format app '$remote_addr $host "$request" $status $body_bytes_sent '
               '"$http_referer" "$http_user_agent" rt=$request_time';

# Flask runs on the host (network_mode: host), not on the compose network.
upstream backend {
    server host.docker.internal:5000;
}

server {
    listen 80 default_server;
    # The tailnet hostname is a permanent second entry point, not a leftover:
    # existing users have it bookmarked. See docs/networking.md.
    server_name marcusthelegend.com www.marcusthelegend.com
                spark-b0aa.taileb1e78.ts.net;

    access_log /var/log/nginx/access.log app;

    # Generated panel art can be large; image uploads go through /api.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serve generated images straight off the bind mount rather than through
    # Flask — this is the bulk of the bytes.
    location /static/images/ {
        alias /srv/images/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image generation and TTS can run for minutes; matches the 180s the
        # Vite dev proxy allowed, with headroom.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    # Built SPA; unknown paths fall through to the client-side router.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
